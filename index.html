<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Diamond Rush: Dark Edges</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Press Start 2P', monospace;
            background: linear-gradient(to bottom, #3b0000 0%, #8b0000 35%, #ffffff 100%);
            background-attachment: fixed;
            margin: 0;
            padding: 0;
            overflow: hidden;
            touch-action: none;
        }
        .pixelated {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
    </style>
</head>
<body class="flex flex-col h-screen w-screen justify-between select-none">

    <!-- ИГРОВОЙ ЭКРАН -->
    <div id="game-container" class="w-full aspect-square bg-black relative overflow-hidden flex flex-col justify-center items-center shadow-2xl">
        <!-- Главное меню -->
        <div id="main-menu" class="absolute inset-0 flex flex-col items-center justify-center p-4 bg-black/40 z-10">
            <button id="play-btn" class="w-3/4 max-w-xs py-6 bg-red-800 hover:bg-red-700 active:bg-red-900 text-white border-4 border-red-950 shadow-[0_0_20px_rgba(255,0,0,0.6)] text-xl font-bold tracking-wider pixelated transition transform active:scale-95 cursor-pointer">
                ИГРАТЬ
            </button>
        </div>

        <!-- Игровой холст -->
        <canvas id="gameCanvas" class="w-full h-full hidden pixelated"></canvas>
    </div>

    <!-- НИЖНЯЯ ЧЕРНАЯ ПАНЕЛЬ С УПРАВЛЕНИЕМ -->
    <div class="w-full bg-black flex-1 flex flex-col items-center justify-center p-4 border-t-4 border-red-950 shadow-inner">
        <div class="grid grid-cols-3 gap-3 w-48 h-48 max-w-full">
            <div></div>
            <button id="btn-up" class="bg-neutral-900 active:bg-red-900 border-2 border-neutral-700 text-white text-xl flex items-center justify-center rounded shadow-md active:scale-95">▲</button>
            <div></div>
            <button id="btn-left" class="bg-neutral-900 active:bg-red-900 border-2 border-neutral-700 text-white text-xl flex items-center justify-center rounded shadow-md active:scale-95">◀</button>
            <div class="bg-neutral-950 border-2 border-neutral-800 rounded"></div>
            <button id="btn-right" class="bg-neutral-900 active:bg-red-900 border-2 border-neutral-700 text-white text-xl flex items-center justify-center rounded shadow-md active:scale-95">▶</button>
            <div></div>
            <button id="btn-down" class="bg-neutral-900 active:bg-red-900 border-2 border-neutral-700 text-white text-xl flex items-center justify-center rounded shadow-md active:scale-95">▼</button>
            <div></div>
        </div>
    </div>

    <script>
        const playBtn = document.getElementById('play-btn');
        const mainMenu = document.getElementById('main-menu');
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let gameStarted = false;

        // Размеры тайла и большой карты (например, 20 на 20 блоков)
        const TILE_SIZE = 32;
        const MAP_WIDTH = 20;
        const MAP_HEIGHT = 20;

        let player = {
            x: 2, // стартовая клетка
            y: 2,
            size: TILE_SIZE
        };

        let audioCtx = null;
        function playSound() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'square';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } catch(e) {}
        }

        playBtn.addEventListener('click', () => {
            playSound();
            mainMenu.classList.add('hidden');
            canvas.classList.remove('hidden');
            gameStarted = true;
            resizeCanvas();
            loop();
        });

        function resizeCanvas() {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
        }

        window.addEventListener('resize', resizeCanvas);

        function update() {}

        function draw() {
            // Очистка экрана
            ctx.fillStyle = '#110000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Расчет камеры, чтобы она следовала за игроком и центрировала его
            let cameraX = player.x * TILE_SIZE - canvas.width / 2 + TILE_SIZE / 2;
            let cameraY = player.y * TILE_SIZE - canvas.height / 2 + TILE_SIZE / 2;

            // Ограничение камеры в пределах карты, чтобы не выходить за границы мира
            cameraX = Math.max(0, Math.min(cameraX, MAP_WIDTH * TILE_SIZE - canvas.width));
            cameraY = Math.max(0, Math.min(cameraY, MAP_HEIGHT * TILE_SIZE - canvas.height));

            ctx.save();
            // Смещаем мир в соответствии с камерой
            ctx.translate(-cameraX, -cameraY);

            // Отрисовка сетки большой карты (стены/блоки для наглядности)
            ctx.strokeStyle = '#330505';
            ctx.lineWidth = 1;
            for (let x = 0; x <= MAP_WIDTH; x++) {
                ctx.beginPath();
                ctx.moveTo(x * TILE_SIZE, 0);
                ctx.lineTo(x * TILE_SIZE, MAP_HEIGHT * TILE_SIZE);
                ctx.stroke();
            }
            for (let y = 0; y <= MAP_HEIGHT; y++) {
                ctx.beginPath();
                ctx.moveTo(0, y * TILE_SIZE);
                ctx.lineTo(MAP_WIDTH * TILE_SIZE, y * TILE_SIZE);
                ctx.stroke();
            }

            // Отрисовка игрока
            ctx.fillStyle = '#ff3333';
            ctx.fillRect(player.x * TILE_SIZE, player.y * TILE_SIZE, TILE_SIZE, TILE_SIZE);

            ctx.restore();
        }

        function loop() {
            if (!gameStarted) return;
            update();
            draw();
            requestAnimationFrame(loop);
        }

        function move(dir) {
            if (!gameStarted) return;
            if (dir === 'up' && player.y > 0) player.y -= 1;
            if (dir === 'down' && player.y < MAP_HEIGHT - 1) player.y += 1;
            if (dir === 'left' && player.x > 0) player.x -= 1;
            if (dir === 'right' && player.x < MAP_WIDTH - 1) player.x += 1;
        }

        document.getElementById('btn-up').addEventListener('click', () => move('up'));
        document.getElementById('btn-down').addEventListener('click', () => move('down'));
        document.getElementById('btn-left').addEventListener('click', () => move('left'));
        document.getElementById('btn-right').addEventListener('click', () => move('right'));

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'w') move('up');
            if (e.key === 'ArrowDown' || e.key === 's') move('down');
            if (e.key === 'ArrowLeft' || e.key === 'a') move('left');
            if (e.key === 'ArrowRight' || e.key === 'd') move('right');
        });
    </script>
</body>
</html>
